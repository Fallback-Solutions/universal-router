[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
via_ir = true
solc_version = '0.8.26'
evm_version = "cancun"

optimizer_runs = 4444
fs_permissions = [{ access = "read", path = "./script/deployParameters/"}]

additional_compiler_profiles = [
  { name = "manager", via_ir = true, optimizer_runs = 30000 },
  { name = "router", via_ir = true, optimizer_runs = 800 },
]

compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 30000 },
  # This fork carries nine commands upstream does not, and no longer fits under EIP-170 at
  # the profile's inlining level. Deployments compile it at 200 runs regardless.
  { paths = "contracts/UniversalRouter.sol", optimizer_runs = 800 },
]

[lint]
lint_on_build = false
exclude_lints = [
    "asm-keccak256",
    "calls-loop",
    "missing-events-access-control",
    "missing-zero-check",
    "reentrancy-events",
    "require-revert-in-loop",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unused-return",
    "unwrapped-modifier-logic",
]

[fmt]
line_length = 120
quote_style = 'single'

[profile.lite.optimizer_details.yulDetails]
optimizerSteps = ''

[rpc_endpoints]
sepolia = "https://rpc.sepolia.org"
unichain_sepolia = "https://sepolia.unichain.org"
base_sepolia = "https://sepolia.base.org"
op_sepolia = "https://sepolia.optimism.io"
mainnet = "https://mainnet.infura.io/v3/${INFURA_API_KEY}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
